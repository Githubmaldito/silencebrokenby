<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Silence Broken By</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Silence</h1>
    
    <div class="config">
      <label>
        Sound effect:
        <select id="audioSelect">
        </select>
      </label>

      <button id="testSoundBtn" class="secondary">Test sound</button>
      
      <label>
        Interval:
        <input type="number" id="interval" value="10" min="5" step="1" />
      </label>
      
      <label>
        Chance to trigger the sound:
        <select id="triggerChance">
          <option value="10">10%</option>
          <option value="20" selected>20%</option>
          <option value="30">30%</option>
          <option value="40">40%</option>
          <option value="50">50%</option>
          <option value="60">60%</option>
          <option value="70">70%</option>
          <option value="80">80%</option>
          <option value="90">90%</option>
        </select>
      </label>
      
      <div class="actions">
        <button id="startBtn">Start</button>
        <button id="stopBtn" disabled>Stop</button>
      </div>
    </div>
    
    <div class="status">
      <p><span id="timerDisplay">--</span></p>
    </div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
